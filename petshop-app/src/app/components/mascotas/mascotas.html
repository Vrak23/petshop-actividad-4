<div class="max-w-6xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-6 sm:p-8">
  <h2 class="text-xl font-bold text-slate-800 mb-6">Registro de Mascotas</h2>

  <div *ngIf="mensajeExito" class="mb-4 p-3 bg-emerald-100 text-emerald-800 text-sm font-semibold rounded-lg">
    ¡Mascota registrada correctamente!
  </div>

  <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
    <!-- Formulario (Lado Izquierdo) -->
    <form #petForm="ngForm" (ngSubmit)="guardarMascota(petForm)" class="md:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2 flex flex-col gap-1">
        <label class="text-xs font-bold text-slate-600">Nombre *</label>
        <input type="text" name="nombre" [(ngModel)]="mascota.nombre" #nombre="ngModel" required minlength="2"
               class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"
               placeholder="Ej: Luna"/>
        <span *ngIf="nombre.invalid && nombre.touched" class="text-xs text-red-500">Mínimo 2 caracteres.</span>
      </div>

      <div class="sm:col-span-2 flex flex-col gap-1">
        <label class="text-xs font-bold text-slate-600">Especie *</label>
        <select name="especie" [(ngModel)]="mascota.especie" #especie="ngModel" required
                class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none">
          <option value="">Selecciona especie</option>
          <option value="Perro">Perro</option>
          <option value="Gato">Gato</option>
          <option value="Ave">Ave</option>
        </select>
        <span *ngIf="especie.invalid && especie.touched" class="text-xs text-red-500">Debe seleccionar una especie.</span>
      </div>

      <div class="sm:col-span-2 flex flex-col gap-1">
        <label class="text-xs font-bold text-slate-600">Raza *</label>
        <input type="text" name="raza" [(ngModel)]="mascota.raza" #raza="ngModel" required
               class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"
               placeholder="Ej: Golden Retriever"/>
        <span *ngIf="raza.invalid && raza.touched" class="text-xs text-red-500">La raza es requerida.</span>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-slate-600">Edad *</label>
        <div class="flex items-center gap-2">
          <input type="number" name="edad" [(ngModel)]="mascota.edad" #edad="ngModel" required min="0"
                 class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"
                 placeholder="Ej: 2"/>
          <span class="text-xs text-slate-500">años</span>
        </div>
        <span *ngIf="edad.invalid && edad.touched" class="text-xs text-red-500">Valor mayor o igual a 0.</span>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-slate-600">Sexo *</label>
        <div class="flex items-center gap-4 py-2">
          <label class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-700 cursor-pointer">
            <input type="radio" name="sexo" value="Macho" [(ngModel)]="mascota.sexo" class="accent-blue-600"> Macho
          </label>
          <label class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-700 cursor-pointer">
            <input type="radio" name="sexo" value="Hembra" [(ngModel)]="mascota.sexo" class="accent-blue-600"> Hembra
          </label>
        </div>
      </div>

      <div class="sm:col-span-2 flex gap-3 pt-4">
        <button type="submit" [disabled]="petForm.invalid" class="bg-[#1b4380] hover:bg-blue-900 text-white font-semibold text-sm px-6 py-2 rounded-md shadow-sm transition-all disabled:opacity-50">
          Registrar
        </button>
        <button type="button" (click)="petForm.resetForm({sexo: 'Macho'})" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-sm px-6 py-2 rounded-md transition-all">
          Limpiar
        </button>
      </div>
    </form>

    <!-- Side Image Card (Lado Derecho) -->
    <div class="md:col-span-4 bg-sky-50 p-6 rounded-xl border border-sky-100 flex flex-col items-center justify-center text-center gap-3">
      <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=300&q=80" alt="Tu mascota" class="w-32 h-32 rounded-full object-cover shadow-md">
      <span class="material-symbols-outlined text-blue-600 text-2xl">pets</span>
      <p class="font-bold text-slate-800 text-sm">Tu mascota<br>merece un gran hogar</p>
    </div>
  </div>
</div>
