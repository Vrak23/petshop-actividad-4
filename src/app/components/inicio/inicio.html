<div class="max-w-6xl mx-auto flex flex-col gap-6">
  <!-- Hero Banner -->
  <div class="relative bg-gradient-to-r from-amber-900/90 via-amber-800/80 to-amber-900/90 rounded-2xl overflow-hidden shadow-lg min-h-[300px] flex items-center p-8 sm:p-12 text-white">
    <div class="max-w-xl flex flex-col gap-3 z-10">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Hogar temporal, <br>para un gran futuro</h1>
      <p class="text-amber-100 text-sm sm:text-base">Adopta, cuida, cambia una vida</p>
      <a routerLink="/adopciones" class="w-fit bg-orange-500 hover:bg-orange-600 text-white font-semibold text-sm px-6 py-2.5 rounded-lg shadow-md transition-all mt-2">
        Conoce más
      </a>
    </div>

    <!-- Pet Image Placeholder / Illustration -->
    <div class="relative w-full md:w-1/2 flex items-center justify-center md:justify-end pr-0 md:pr-4 pt-4 md:pt-0">
      <img src="assets/mascotas.png" alt="Mascotas PetShop" class="h-56 md:h-64 object-contain rounded-lg">
    </div>
  </div>

  <!-- 4 Action Cards Below Banner -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <!-- Card 1: Mascotas -->
    <a routerLink="/mascotas" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-all flex flex-col items-center text-center gap-2 group">
      <div class="w-12 h-12 rounded-full bg-blue-50 text-[#1b4380] flex items-center justify-center group-hover:bg-[#1b4380] group-hover:text-white transition-colors">
        <span class="material-symbols-outlined text-2xl">pets</span>
      </div>
      <h3 class="font-bold text-slate-800 text-sm">Mascotas</h3>
      <p class="text-xs text-slate-500">Ver y registrar</p>
    </a>

    <!-- Card 2: Clientes -->
    <a routerLink="/clientes" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-all flex flex-col items-center text-center gap-2 group">
      <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-colors">
        <span class="material-symbols-outlined text-2xl">person</span>
      </div>
      <h3 class="font-bold text-slate-800 text-sm">Clientes</h3>
      <p class="text-xs text-slate-500">Gestionar propietarios</p>
    </a>

    <!-- Card 3: Adopciones -->
    <a routerLink="/adopciones" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-all flex flex-col items-center text-center gap-2 group">
      <div class="w-12 h-12 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center group-hover:bg-rose-500 group-hover:text-white transition-colors">
        <span class="material-symbols-outlined text-2xl">favorite</span>
      </div>
      <h3 class="font-bold text-slate-800 text-sm">Adopciones</h3>
      <p class="text-xs text-slate-500">Dar una oportunidad</p>
    </a>

    <!-- Card 4: Dashboard -->
    <a routerLink="/dashboard" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-all flex flex-col items-center text-center gap-2 group">
      <div class="w-12 h-12 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center group-hover:bg-purple-600 group-hover:text-white transition-colors">
        <span class="material-symbols-outlined text-2xl">bar_chart</span>
      </div>
      <h3 class="font-bold text-slate-800 text-sm">Dashboard</h3>
      <p class="text-xs text-slate-500">Ver estadísticas</p>
    </a>
  </div>
</div>
